name: ICOP Phase 6 Cloudflare Worker build (dry-run)

on:
  push:
    branches: [fix/cloudflare-phase6-monorepo-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icop-phase6-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Validate TypeScript for frontend
        working-directory: apps/web
        run: npm run typecheck
      - name: Verify OpenNext can create Worker output
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Validate Worker with app-root Wrangler config
        working-directory: apps/web
        run: npx wrangler deploy --dry-run
      - name: Validate original deploy-only command from repository root
        run: npx --yes wrangler@4.149.0 deploy --dry-run
      - name: Audit production frontend packages
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
