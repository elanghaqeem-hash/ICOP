# Temporary owner-scoped lockfile synchronization for Phase 5 migration.
# Delete this maintenance workflow immediately after lockfile regeneration.
name: ICOP temporary API lockfile refresh
on:
  push:
    branches: ['feature/phase5-source-integration']
    paths: ['apps/api/package.json', '.github/workflows/api-lockfile-refresh.yml']
permissions:
  contents: write
concurrency:
  group: icop-api-lockfile-refresh
  cancel-in-progress: false
jobs:
  update-lock:
    if: github.repository == 'elanghaqeem-hash/ICOP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update API lockfile
        working-directory: apps/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved dependency lockfile
        run: |
          git add -- apps/api/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(api): regenerate dependencies lockfile'
          git push origin HEAD:feature/phase5-source-integration
