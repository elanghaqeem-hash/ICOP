# Temporary maintenance workflow: only used on controlled feature branch.
# Remove after package-lock.json is generated and reviewed.
name: ICOP temporary lockfile refresh
on:
  push:
    branches: ['feature/phase5-source-integration']
    paths:
      - 'apps/web/package.json'
      - 'apps/api/package.json'
      - '.github/workflows/lockfile-refresh.yml'
permissions:
  contents: write
concurrency:
  group: icop-lockfile-refresh
  cancel-in-progress: false
jobs:
  update-lock:
    if: github.repository == 'elanghaqeem-hash/ICOP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update web lockfile from package manifest
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile if changed
        run: |
          git add -- apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(web): regenerate package lock for Next 16'
          git push origin HEAD:feature/phase5-source-integration
