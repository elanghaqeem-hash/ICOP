name: ICOP Dual Target Config Validation (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.hostinger.yml'
      - 'infra/hostinger/**'
      - 'docs/28-Dual-Deployment-Cloudflare-Hostinger.md'
      - '.github/workflows/deployment-dual-target-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hostinger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable configuration for CI validation ONLY
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pass="$(openssl rand -hex 32)"
          jwt="$(openssl rand -hex 48)"
          master="$(openssl rand -hex 32)"
          cat > infra/hostinger/.env.production <<EOF
          ICOP_DOMAIN=ci-icop.invalid
          ACME_EMAIL=ci@validation.invalid
          NODE_ENV=production
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=icop_ci
          DB_USER=icop_ci
          DB_PASSWORD=${pass}
          DATABASE_URL=postgres://icop_ci:${pass}@postgres:5432/icop_ci
          JWT_SECRET=${jwt}
          SECRETS_MASTER_KEY=${master}
          RUN_SEED=false
          ESIGN_SANDBOX_ENABLED=false
          API_DOCS_ENABLED=false
          APP_PUBLIC_ORIGIN=https://ci-icop.invalid
          ALLOWED_ORIGINS=https://ci-icop.invalid
          EOF
          chmod 600 infra/hostinger/.env.production
      - name: Validate release script, isolated port exposure and Compose interpolation
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/hostinger/deploy.sh
          bash infra/hostinger/deploy.sh preflight
          docker compose --env-file infra/hostinger/.env.production -f docker-compose.hostinger.yml config --quiet
          docker compose --env-file infra/hostinger/.env.production -f docker-compose.hostinger.yml config --format json |
            jq -e '.services | ((.postgres.ports // []) | length == 0) and ((.api.ports // []) | length == 0) and ((.web.ports // []) | length == 0)' >/dev/null
          docker compose --env-file infra/hostinger/.env.production -f docker-compose.hostinger.yml config --profiles | grep -Fxq migration
      - name: Validate Caddy production HTTPS configuration
        run: |
          docker run --rm -e ICOP_DOMAIN=ci-icop.invalid -e ACME_EMAIL=ci@validation.invalid             -v "$PWD/infra/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify no credentials or production database copied to CI artefacts
        run: |
          git check-ignore -q infra/hostinger/.env.production
          test ! -e infra/hostinger/backups
