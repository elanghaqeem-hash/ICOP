name: ICOP Cloudflare Free Native Staging API (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/cloudflare/free-staging/**'
      - 'apps/web/wrangler.staging.jsonc'
      - 'apps/web/src/app/api/v1/**'
      - '.github/workflows/cloudflare-free-native-staging-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-bootstrap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Cloudflare-native staging API security tests
        run: node --test infra/cloudflare/free-staging/tests/*.test.mjs
      - name: Validate identity/tenant/audit schema with in-memory SQLite
        run: python3 -m unittest discover -s infra/cloudflare/free-staging/tests -p 'test_*.py' -v
      - name: Confirm isolated Worker/D1 wiring and no production changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const api = JSON.parse(fs.readFileSync('infra/cloudflare/free-staging/wrangler.jsonc', 'utf8'));
          const web = JSON.parse(fs.readFileSync('apps/web/wrangler.staging.jsonc', 'utf8'));
          const main = fs.readFileSync('apps/web/wrangler.jsonc', 'utf8');
          assert.equal(api.name, 'icop-staging-api');
          assert.equal(api.preview_urls, false);
          assert.equal(api.d1_databases[0].database_name, 'icop-staging-db');
          assert.equal(web.name, 'icop-staging');
          assert.ok(web.services.some(x => x.binding === 'ICOP_API' && x.service === 'icop-staging-api'));
          assert.ok(!main.includes('"binding": "ICOP_API"'), 'production Worker must not attach staging API');
          assert.ok(!('containers' in api));
          console.log('PASS: Cloudflare Free staging isolated from production');
          JS

  live-cloudflare-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify staging D1 health over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://icop-staging-api.elang-haqeem.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 "$ROOT/health" -o /tmp/icop-health.json
          node -e 'const d=require("/tmp/icop-health.json");if(d.status!=="ok"||d.database!=="ready"||d.environment!=="staging")process.exit(1);console.log("PASS: live Cloudflare D1 health")'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 15 "$ROOT/api/v1/system/readiness" -o /tmp/icop-readiness.json
          node -e 'const d=require("/tmp/icop-readiness.json");if(d.status!=="bootstrap_only"||Object.values(d.capabilities).some(Boolean)||d.schema?.identity_audit_prepared!==true||d.schema?.auth_security_prepared!==true)process.exit(1);console.log("PASS: live D1 identity/audit schema ready, all functional modules still disabled")'
          code="$(curl --silent --show-error --max-time 15 -o /tmp/icop-auth.json -w '%{http_code}' \
            -X POST "$ROOT/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            --data '{"tenant":"nonexistent"}')"
          test "$code" = 503
          node -e 'const d=require("/tmp/icop-auth.json");if(d.code!=="STAGING_AUTH_NOT_READY")process.exit(1);console.log("PASS: live auth correctly disabled")'
          rm -f /tmp/icop-health.json /tmp/icop-readiness.json /tmp/icop-auth.json
